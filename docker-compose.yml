services:
  # PHP-FPM: eksekusi Laravel, tidak diakses langsung dari luar
  brt-app:
    build:
      context: .
      target: app
    container_name: brt-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      # Persistensi storage + database sqlite + .env agar bisa diubah tanpa rebuild
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    networks:
      app-network:
        aliases:
          - brt-app
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx: satu-satunya yang menerima HTTP, ditembak Cloudflare Tunnel.
  # Contoh ingress di cloudflared config.yml (satu network app-network):
  #   - hostname: brt.example.com
  #     service: http://brt-web:80
  # Alias brt_apps disediakan agar target http://brt_apps:80 juga bisa dipakai.
  brt-web:
    build:
      context: .
      target: web
    container_name: brt-web
    restart: unless-stopped
    # Hanya expose ke dalam network, tanpa publish port ke host.
    # Cloudflare Tunnel (di network yang sama) forward ke http://brt-web:80
    # atau http://brt_apps:80
    expose:
      - "80"
    volumes:
      # Mount yang sama dengan php-fpm (read-only): dibaca lewat
      # symlink public/storage -> /var/www/html/storage/app/public
      - ./storage:/var/www/html/storage:ro
    networks:
      app-network:
        aliases:
          - brt-web
          - brt_apps
    depends_on:
      brt-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Join ke network yang sudah dipakai service mysql + cloudflared.
  # Pastikan network ini sudah ada (dibuat oleh stack mysql).
  app-network:
    name: app-network
    external: true
